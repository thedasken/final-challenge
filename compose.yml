services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-api
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get({host:'127.0.0.1',port:process.env.PORT,path:'/health'},response=>process.exit(response.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
